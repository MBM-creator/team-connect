name: Refresh Team Connect lockfile

on:
  push:
    branches:
      - chore/team-lockfile-strict-install

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/team-lockfile-strict-install
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Regenerate lockfile
        run: npm install --package-lock-only
      - name: Verify strict install
        run: npm ci
      - name: Run tests
        run: npm test
      - name: Type-check
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Restore strict Vercel install
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const path = 'vercel.json';
          const json = JSON.parse(fs.readFileSync(path, 'utf8'));
          delete json.installCommand;
          fs.writeFileSync(path, JSON.stringify(json, null, 2) + '\n');
          NODE
      - name: Remove one-off workflow and commit
        run: |
          rm .github/workflows/refresh-lockfile.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json vercel.json .github/workflows/refresh-lockfile.yml
          git commit -m "chore: refresh lockfile and restore strict install"
          git push origin HEAD:chore/team-lockfile-strict-install
